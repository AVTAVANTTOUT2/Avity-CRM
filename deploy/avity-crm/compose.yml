# Adapted from packages/twenty-docker/docker-compose.yml at twenty/v2.45.0.
name: avity-crm

x-application-environment: &application-environment
  NODE_ENV: production
  PG_DATABASE_URL: postgres://avity_crm:${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}@db:5432/avity_crm
  SERVER_URL: ${SERVER_URL:-http://localhost:3020}
  REDIS_URL: redis://redis:6379
  STORAGE_TYPE: local
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
  IS_CONFIG_VARIABLES_IN_DB_ENABLED: "false"
  IS_MULTIWORKSPACE_ENABLED: "false"
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "true"
  IS_EMAIL_VERIFICATION_REQUIRED: "false"
  SIGN_IN_PREFILLED: "false"
  IS_BILLING_ENABLED: "false"
  EMAIL_DRIVER: LOGGER
  EMAILING_DOMAIN_DRIVER: LOG
  AUTH_PASSWORD_ENABLED: "true"
  AUTH_GOOGLE_ENABLED: "false"
  AUTH_MICROSOFT_ENABLED: "false"
  IS_IMAP_SMTP_CALDAV_ENABLED: "false"
  TELEMETRY_ENABLED: "false"
  ANALYTICS_ENABLED: "false"
  MARKETPLACE_CATALOG_SYNC_CRON_ENABLED: "false"
  SHOULD_SEED_DEMO_DATA: "false"
  MESSAGING_PROVIDER_GMAIL_ENABLED: "false"
  CALENDAR_PROVIDER_GOOGLE_ENABLED: "false"
  MESSAGING_PROVIDER_MICROSOFT_ENABLED: "false"
  CALENDAR_PROVIDER_MICROSOFT_ENABLED: "false"

x-application: &application
  image: avity-crm:git-${GIT_SHA:?Set the exact fork commit SHA}
  pull_policy: never
  restart: unless-stopped
  volumes:
    - server-local-data:/app/packages/twenty-server/.local-storage
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    <<: *application
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
      args:
        APP_VERSION: v2.45.0
      labels:
        org.opencontainers.image.source: https://github.com/AVTAVANTTOUT2/Avity-CRM
        org.opencontainers.image.revision: ${GIT_SHA:?Set the exact fork commit SHA}
    ports:
      - "127.0.0.1:${HTTP_PORT:-3020}:3000"
    environment:
      <<: *application-environment
      NODE_PORT: 3000
      NODE_OPTIONS: --max-old-space-size=1536
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: 2g
    cpus: 1.5

  worker:
    <<: *application
    command: ["yarn", "worker:prod"]
    environment:
      <<: *application-environment
      NODE_OPTIONS: --max-old-space-size=768
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: avity_crm
      POSTGRES_USER: avity_crm
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "avity_crm", "-d", "avity_crm", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
  server-local-data:
  redis-data:
