pid /run/avity-crm-proxy/nginx.pid;
error_log stderr warn;
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /run/avity-crm-proxy/client-body;
  proxy_temp_path /run/avity-crm-proxy/proxy-temp;
  fastcgi_temp_path /run/avity-crm-proxy/fastcgi-temp;
  uwsgi_temp_path /run/avity-crm-proxy/uwsgi-temp;
  scgi_temp_path /run/avity-crm-proxy/scgi-temp;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen unix:/run/avity-crm-proxy/http.sock;
    server_name crm.avity.fr;
    client_max_body_size 100m;
    # Cloudflare sets this header; this socket is reachable only by its connector.
    if ($http_x_forwarded_proto != 'https') {
      return 308 https://crm.avity.fr$request_uri;
    }
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location / {
      proxy_pass http://127.0.0.1:3020;
      proxy_http_version 1.1;
      proxy_set_header Host crm.avity.fr;
      proxy_set_header X-Forwarded-Host crm.avity.fr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
